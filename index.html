<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Orbit — Upcoming Space Launches</title>
		<meta
			name="description"
			content="Track upcoming rocket launches and space events with a live countdown to the next liftoff."
		/>
		<meta property="og:title" content="Orbit — Upcoming Space Launches" />
		<meta property="og:description" content="Upcoming rocket launches and space events." />
		<meta property="og:type" content="website" />
		<meta name="theme-color" content="#07080c" />
		<link rel="icon" href="favicon.svg" type="image/svg+xml" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Space+Mono&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="/src/styles/main.css" />
		<script type="module" src="/src/pages/home.ts"></script>
	</head>
	<body>
		<a class="skip-link" href="#main">Skip to content</a>

		<header class="site-header">
			<a class="logo" href="index.html">Orbit</a>
			<nav aria-label="Main">
				<ul>
					<li><a href="index.html" aria-current="page">Home</a></li>
					<li><a href="launches.html">Launches</a></li>
				</ul>
			</nav>
		</header>

		<main id="main">
			<section class="hero" aria-labelledby="hero-title">
				<p class="eyebrow">Next launch</p>
				<h1 id="hero-title">Watch the next rocket leave Earth</h1>
				<div id="next-launch" class="next-launch" aria-live="polite"></div>
			</section>

			<section class="section" aria-labelledby="upcoming-title">
				<div class="section-head">
					<h2 id="upcoming-title">Coming up</h2>
					<a class="arrow-link" href="launches.html"
						>All launches<svg
							class="icon"
							viewBox="0 0 32 32"
							fill="currentColor"
							aria-hidden="true"
						>
							<path
								d="M18 6 16.57 7.393 24.15 15 4 15 4 17 24.15 17 16.57 24.573 18 26 28 16 18 6z"
							/></svg
					></a>
				</div>
				<div id="upcoming" aria-live="polite"></div>
			</section>

			<section class="section" aria-labelledby="events-title">
				<div class="section-head">
					<h2 id="events-title">Space events</h2>
				</div>
				<div id="events" aria-live="polite"></div>
			</section>
		</main>

		<footer class="site-footer">
			<p>
				Data from
				<a href="https://thespacedevs.com/llapi">Launch Library 2</a>
				by The Space Devs.
			</p>
		</footer>
	</body>
</html>
